[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/en/*"
  to = "/en/:splat"
  status = 200

[[redirects]]
  from = "/es/*"
  to = "/es/:splat"
  status = 200

[[redirects]]
  from = "/ar/*"
  to = "/ar/:splat"
  status = 200

[[redirects]]
  from = "/zh/*"
  to = "/zh/:splat"
  status = 200

# Astro server routes (members auth, etc.). Must appear before the `/*` catch-all below,
# otherwise `/api/...` is 301'd to `/en/api/...` and the SSR handler never runs.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ssr"
  status = 200

# WS-B locked: No-locale URLs redirect to English canonical routes.
[[redirects]]
  from = "/*"
  to = "/en/:splat"
  status = 301

