name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - "packages/locales/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      # CLI / Node (deploy + build)
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
      # Vite inlines SANITY_STUDIO_* into the browser bundle; without these the hosted URL shows "missing SANITY_PROJECT_ID/SANITY_DATASET".
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_STUDIO_NETLIFY_SITE_NAME: ${{ secrets.NETLIFY_SITE_NAME }}
      SANITY_STUDIO_NETLIFY_SITE_API_ID: ${{ secrets.NETLIFY_SITE_API_ID }}
      SANITY_STUDIO_NETLIFY_BUILD_HOOK_ID: ${{ secrets.NETLIFY_BUILD_HOOK_ID }}
      SANITY_STUDIO_PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Studio
        run: npm run deploy:studio
